<title>Restless Earth</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed globe; instrument panels float at the edges like a seismic observatory console. */
:root{
  --basalt:#0a0c0f;
  --panel:rgba(16,19,23,.84);
  --panel-solid:#14181d;
  --line:#2b3138;
  --ash:#e4ded3;
  --muted:#8f949b;
  --magma:#ff6a2b;
  --ember:#ffb347;
  --tide:#3fd0ff;
  --fault:#f3e3a2;
  --converge:#ff4d2e;
  --f-display:"Chakra Petch","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
html,body{height:100%;}
body{background:var(--basalt);color:var(--ash);font-family:var(--f-body);font-size:14px;overflow:hidden;-webkit-font-smoothing:antialiased;}
#app{position:fixed;inset:0;}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
#gl.dragging{cursor:grabbing;}
#gl.pick{cursor:crosshair;}
button,input{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--ember);outline-offset:2px;}

.hud{z-index:2;position:absolute;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);}

/* header */
#top{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;pointer-events:none;}
#top > *{pointer-events:auto;}
.brand{display:flex;align-items:baseline;gap:10px;}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:.06em;text-transform:uppercase;line-height:1;}
.brand h1 span{color:var(--magma);}
.brand small{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.04em;}
.tabs{display:inline-flex;padding:3px;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:max-content;}
.tabs button{background:none;border:0;padding:7px 14px;border-radius:999px;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tabs button[aria-pressed="true"]{background:var(--ash);color:var(--basalt);}

/* right info panel */
#panel{top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));width:330px;max-height:calc(100% - 210px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:12px;}
#panel .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);}
#panel h2{margin:0;font-family:var(--f-display);font-size:22px;font-weight:600;letter-spacing:.02em;line-height:1.15;text-wrap:balance;}
#panel p{margin:0;line-height:1.55;color:#cfc9be;}
#panel .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;}
#panel .stat{display:flex;flex-direction:column;gap:2px;min-width:0;}
#panel .stat b{font-family:var(--f-mono);font-weight:500;font-size:16px;color:var(--ash);font-variant-numeric:tabular-nums;}
#panel .stat span{font-size:11px;color:var(--muted);letter-spacing:.04em;}
#panel .row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--ash);}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block;}
.btn{border:1px solid var(--line);background:#1b2026;padding:8px 12px;border-radius:8px;font-weight:500;}
.btn:hover{border-color:#4a525c;}
.btn.hot{background:var(--magma);border-color:var(--magma);color:#1a0b04;font-weight:600;}
.btn.cool{background:var(--tide);border-color:var(--tide);color:#03141c;font-weight:600;}
.list{display:flex;flex-direction:column;gap:2px;margin:0;padding:0;list-style:none;}
.list button{width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:6px 8px;display:flex;justify-content:space-between;gap:10px;color:var(--ash);}
.list button:hover{background:#1e242b;}
.list button em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--muted);white-space:nowrap;}
.legend{display:flex;flex-direction:column;gap:6px;font-size:12px;color:#cfc9be;}
.legend div{display:flex;align-items:center;gap:8px;}
.legend i{width:18px;height:4px;border-radius:2px;display:inline-block;flex:none;}
.note{font-size:12px;color:var(--muted);line-height:1.5;}
#panelToggle{display:none;}

/* bottom dock */
#dock{left:max(332px,calc(50% - 320px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);padding:10px 12px;display:flex;flex-direction:column;gap:10px;width:min(640px,calc(100% - 348px - max(16px,env(safe-area-inset-right,0px))));}
.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.tools button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:8px;border:1px solid transparent;background:#181c21;font-family:var(--f-display);font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);}
.tools button svg{width:20px;height:20px;}
.tools button[aria-pressed="true"]{color:var(--ash);border-color:var(--ember);background:#231a12;}
.tools button[data-tool="tsunami"][aria-pressed="true"]{border-color:var(--tide);background:#0f1f26;}
.ctrl{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);}
.ctrl label{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;min-width:84px;}
.ctrl output{font-family:var(--f-mono);font-size:12px;color:var(--ash);min-width:92px;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;}
input[type=range]{flex:1;min-width:0;accent-color:var(--magma);height:22px;}
.toggles{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#cfc9be;}
.toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;}
.toggles input{accent-color:var(--ember);}
.iconbtn{background:#181c21;border:1px solid var(--line);border-radius:8px;width:34px;height:30px;display:grid;place-items:center;flex:none;}
.iconbtn svg{width:14px;height:14px;}

/* seismograph */
#seismo{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 14px);width:300px;padding:8px 10px 8px;display:flex;flex-direction:column;gap:4px;}
#seismo header{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
#seismo header b{color:var(--ember);font-weight:500;}
#seismoCv{width:100%;height:84px;display:block;}
#seismoFoot{font-family:var(--f-mono);font-size:10.5px;color:#cfc9be;min-height:14px;font-variant-numeric:tabular-nums;}

/* clocks & banners */
#banner{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);left:50%;transform:translateX(-50%);padding:8px 14px;border-radius:999px;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;background:var(--panel-solid);border:1px solid var(--line);white-space:nowrap;}
#banner.warn{border-color:var(--tide);color:var(--tide);}
#banner.quake{border-color:var(--ember);color:var(--ember);}
#tip{position:absolute;pointer-events:none;padding:5px 9px;border-radius:6px;background:var(--panel-solid);border:1px solid var(--line);font-size:12px;white-space:nowrap;transform:translate(12px,-50%);}
#tip em{font-style:normal;color:var(--muted);font-family:var(--f-mono);font-size:11px;margin-left:6px;}
.lbl{position:absolute;pointer-events:none;font-family:var(--f-mono);font-size:11px;letter-spacing:.04em;color:var(--ash);white-space:nowrap;display:flex;align-items:center;gap:6px;text-shadow:0 1px 3px #000,0 0 8px #000;transform:translate(-4px,-50%);}
.lbl::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ash);box-shadow:0 0 0 2px rgba(0,0,0,.5);flex:none;}
.lbl.rim{color:var(--tide);}
.lbl.rim::before{background:var(--tide);}
.lbl.rim.s{color:var(--ember);}
.lbl.rim.s::before{background:var(--ember);}
#loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}

@media (max-width:760px){
  .brand h1{font-size:20px;}
  .brand small{display:none;}
  #panel{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 182px);left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));width:auto;max-height:28%;padding:12px 14px;}
  #panel.collapsed{max-height:44px;overflow:hidden;}
  #panelToggle{display:block;position:absolute;top:8px;right:8px;background:#1b2026;border:1px solid var(--line);border-radius:6px;font-family:var(--f-mono);font-size:10px;padding:4px 8px;letter-spacing:.08em;text-transform:uppercase;}
  #panel h2{font-size:18px;padding-right:64px;}
  #seismo{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:auto;top:calc(env(safe-area-inset-top,0px) + 96px);width:200px;padding:6px 8px;}
  #seismoCv{height:56px;}
  #seismoFoot{font-size:9.5px;}
  #dock{left:max(16px,env(safe-area-inset-left,0px));width:auto;right:max(16px,env(safe-area-inset-right,0px));padding:8px 10px;gap:8px;}
  .ctrl label{min-width:64px;}
  .ctrl output{min-width:70px;}
  #banner{top:calc(env(safe-area-inset-top,0px) + 172px);font-size:11px;}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<div id="app">
  <canvas id="gl" aria-label="Interactive 3D globe of Earth's tectonic plates"></canvas>
  <div id="loading">Building the planet…</div>

  <div id="top">
    <div class="brand"><h1>Restless <span>Earth</span></h1><small>plates · interior · hazards</small></div>
    <div class="tabs" role="group" aria-label="View">
      <button id="tabSurface" aria-pressed="true">Surface</button>
      <button id="tabInside" aria-pressed="false">Inside Earth</button>
    </div>
  </div>

  <aside id="panel" class="hud" aria-live="polite">
    <button id="panelToggle" aria-expanded="true">Hide</button>
    <div id="panelBody"></div>
  </aside>

  <section id="seismo" class="hud" aria-label="Seismograph">
    <header><span>Seismograph · <b id="stationName">ANMO</b></span><span id="seismoClock">listening</span></header>
    <canvas id="seismoCv"></canvas>
    <div id="seismoFoot">Trigger an earthquake to record it here.</div>
  </section>

  <section id="dock" class="hud" aria-label="Controls">
    <div id="surfaceCtrls" style="display:flex;flex-direction:column;gap:10px;">
      <div class="tools" role="group" aria-label="Tool">
        <button data-tool="explore" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg>Explore</button>
        <button data-tool="erupt" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 20l6-9h6l6 9z"/><path d="M10 8c-1-2 0-4 2-5M14 8c1-2 0-3-1-4M12 11V7"/></svg>Erupt</button>
        <button data-tool="quake" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12h4l2-6 3 12 3-9 2 5 2-2h4"/></svg>Quake</button>
        <button data-tool="tsunami" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 17c2 0 3-2 5-2s3 2 5 2 3-2 5-2 3 2 5 2"/><path d="M4 12c0-4 4-7 8-7 3 0 4 2 3 4-1 1-3 1-3 3"/></svg>Tsunami</button>
      </div>
      <div class="ctrl"><label for="strength" id="strengthLbl">Magnitude</label><input type="range" id="strength" min="4" max="9.5" step="0.1" value="8.0"><output id="strengthOut">Mw 8.0</output></div>
      <div class="ctrl"><label for="clock">Plate clock</label><button class="iconbtn" id="playBtn" aria-label="Play plate motion"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg></button><input type="range" id="clock" min="-80" max="80" step="0.5" value="0"><output id="clockOut">Today</output></div>
      <div class="toggles">
        <label><input type="checkbox" id="tgPlates" checked> Plate colours</label>
        <label><input type="checkbox" id="tgBounds" checked> Boundaries</label>
        <label><input type="checkbox" id="tgFlow" checked> Motion</label>
        <label><input type="checkbox" id="tgMarks" checked> Landmarks</label>
        <label><input type="checkbox" id="tgSound"> Sound</label>
      </div>
    </div>
    <div id="insideCtrls" style="display:none;flex-direction:column;gap:10px;">
      <div class="row" style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn hot" id="waveBtn">Send seismic waves</button>
        <button class="btn" id="convBtn" aria-pressed="true">Convection: on</button>
        <button class="btn" id="backBtn">Back to surface</button>
      </div>
      <div class="note">Drag to orbit. Hover or tap a layer to read it. Crust thickness is exaggerated so you can see it; every other boundary is drawn to true scale.</div>
    </div>
  </section>

  <div id="banner" hidden></div>
  <div id="tip" hidden></div>
  <div id="labels"></div>
</div>

/* ---------- Geometry helpers (y up; lon 0 on +x, east toward -z) ---------- */
function ll2v(lat,lon,out){const a=lat*D2R,b=lon*D2R;out=out||new THREE.Vector3();return out.set(Math.cos(a)*Math.cos(b),Math.sin(a),-Math.cos(a)*Math.sin(b));}
function v2ll(v){const n=v.clone().normalize();return {lat:Math.asin(n.y)/D2R,lon:Math.atan2(-n.z,n.x)/D2R};}
function angDist(a,b){return Math.acos(Math.max(-1,Math.min(1,a.dot(b)/(a.length()*b.length()))));}
function rotAxis(v,k,ang,out){out=out||new THREE.Vector3();const c=Math.cos(ang),s=Math.sin(ang),d=k.dot(v);
  const cx=k.y*v.z-k.z*v.y,cy=k.z*v.x-k.x*v.z,cz=k.x*v.y-k.y*v.x;
  return out.set(v.x*c+cx*s+k.x*d*(1-c),v.y*c+cy*s+k.y*d*(1-c),v.z*c+cz*s+k.z*d*(1-c));}
function fmtLat(l){return Math.abs(l).toFixed(1)+'°'+(l>=0?'N':'S');}
function fmtLon(l){return Math.abs(l).toFixed(1)+'°'+(l>=0?'E':'W');}
function fmtNum(n){return n.toLocaleString('en-US',{maximumFractionDigits:0});}

function plateOf(v){let best=-2,id=0;for(let i=0;i<SEEDS.length;i++){const s=SEEDS[i].v,d=s.x*v.x+s.y*v.y+s.z*v.z;if(d>best){best=d;id=SEEDS[i].id;}}return id;}
function velocity(id,p){return new THREE.Vector3().crossVectors(PLATES[id].wvec,p).multiplyScalar(RE);} // mm/yr
function frame(p){const n=p.clone().normalize();let e=new THREE.Vector3(0,1,0).cross(n);if(e.lengthSq()<1e-8)e.set(1,0,0);e.normalize();const nn=new THREE.Vector3().crossVectors(n,e);return {e,n:nn};}
function bearing(v,p){const f=frame(p);const a=Math.atan2(v.dot(f.e),v.dot(f.n))/D2R;return (a+360)%360;}
function compass(b){return ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'][Math.round(b/22.5)%16];}

 pendingAction=()=>quakeAt(q.cur,q.mw,q);setPanel(html);if(go)setTimeout(()=>quakeAt(q.cur,q.mw,q),500);}
function veiVolume(v){return ['<10,000 m³','10,000 m³','1 million m³','10 million m³','0.1 km³','1 km³','10 km³','100 km³','1,000 km³'][v];}
function tnt(M){const E=Math.pow(10,1.5*M+4.8);const t=E/4.184e9;if(t>=1e9)return (t/1e9).toFixed(t<1e10?1:0)+' gigatons';if(t>=1e6)return (t/1e6).toFixed(t<1e7?1:0)+' megatons';if(t>=1e3)return (t/1e3).toFixed(0)+' kilotons';return t.toFixed(0)+' tons';}

function eruptAt(p,vei,name,kind,v){
 startEruption(p,vei,name);flyTo(p,Math.min(orbit.tdist,2.2));
 const H=['<0.1 km','0.1–1 km','1–5 km','3–15 km','10–25 km','>25 km','>25 km','>25 km'][vei];
 const ex={1:'Stromboli\'s nightly bursts',2:'Kīlauea\'s lava fountains',3:'Etna\'s typical eruptions',4:'Eyjafjallajökull, 2010',5:'Mount St. Helens, 1980',6:'Pinatubo, 1991',7:'Tambora, 1815'}[vei];
 flashBanner(name+' erupting · VEI '+vei,'quake',3000);
 pendingAction=()=>eruptAt(p,vei,name,kind,v);
 setPanel('<div class="eyebrow">Eruption · VEI '+vei+'</div><h2>'+name+' is erupting</h2><div class="row"><span class="chip"><i style="background:var(--magma)"></i>'+kind+'</span></div>'+
  '<div class="stats"><div class="stat"><b>'+H+'</b><span>Eruption column height</span></div><div class="stat"><b>'+veiVolume(vei)+'</b><span>Material thrown out</span></div></div>'+
  '<p>Lava fountains near the vent while ash rises until it is no lighter than the air around it. Then it spreads sideways into an umbrella cloud and drifts with the wind.</p><p class="note">A similar size: '+ex+'. Each VEI step is roughly 10× more material.</p><div class="row"><button class="btn hot" data-act>Erupt again</button></div>');
 if(v&&v.mesh){}
}

let quake=null,station=null;
function quakeAt(p,M,q){
 const pa=plateAt(p);const orig=pa?pa.orig:p;
 U.uQ.value.copy(p);U.uQT.value=0;U.uQA.value=Math.max(.25,Math.min(1,(M-3.5)/5.5));
 // pick a station 30–90° away (the classic teleseismic range)
 let best=null,bs=1e9;STATIONS.forEach(s=>{s.mesh.visible=false;const d=angDist(s.cur,p)/D2R;const sc=d<20?1000+(20-d):Math.abs(d-60);if(sc<bs){bs=sc;best=s;}});
 station=best;station.mesh.visible=true;
 const dKm=angDist(station.cur,p)*RE;
 quake={p:p.clone(),M,t0:simReal,dKm,deg:dKm/RE/D2R,tP:dKm/8,tS:dKm/4.5,tR:dKm/3.5,name:q?q.name+' '+q.year:'Your earthquake'};
 $('#stationName').textContent=station.code;
 shake=Math.max(shake,.012*Math.pow(1.6,M-6));rumble(2.5+M*.5,Math.min(1,.15+(M-4)*.15));
 if(!q)flyTo(p,Math.max(2.6,orbit.tdist));
 const nb=nearestBoundary(orig,4);const ocean=!isLandAtCurrent(p);
 const ll=v2ll(p);
 const E=tnt(M);
 setPanel('<div class="eyebrow">'+(q?'Replay · ':'')+fmtLat(ll.lat)+' '+fmtLon(ll.lon)+'</div><h2>'+(q?q.name+', '+q.year:'Mw '+M.toFixed(1)+' earthquake')+'</h2>'+
  '<div class="stats"><div class="stat"><b>Mw '+M.toFixed(1)+'</b><span>Moment magnitude</span></div><div class="stat"><b>'+E+'</b><span>Energy, TNT equivalent</span></div>'+
  '<div class="stat"><b>'+(Math.pow(10,1.5*(M-7))<1?(Math.pow(10,1.5*(M-7))).toFixed(2):fmtNum(Math.pow(10,1.5*(M-7))))+'×</b><span>Energy of a Mw 7.0</span></div><div class="stat"><b>'+station.code+' · '+fmtNum(dKm)+' km</b><span>Recording station</span></div></div>'+
  (nb?'<div class="row"><span class="chip"><i style="background:'+BCOL[nb.type]+'"></i>'+BNAME[nb.type]+' boundary · '+PLATES[nb.a].name+' / '+PLATES[nb.b].name+'</span></div>':'<p class="note">This spot is far from any plate boundary. Intraplate quakes do happen, like New Madrid in 1811–12, but they are rare.</p>')+
  (q?'<p>'+q.fact+'</p>':'<p>Every step of 1 on the magnitude scale releases about 32 times more energy. A Mw 9 releases about 1,000 times more than a Mw 7.</p>')+
  '<div class="legend"><div><i style="background:#ffd473"></i>P-waves · push-pull, ~8 km/s</div><div><i style="background:#ff8c33"></i>S-waves · side to side, ~4.5 km/s</div><div><i style="background:var(--converge)"></i>Surface waves · rolling, ~3.5 km/s</div></div>');
 if(ocean&&M>=7.5){setTimeout(()=>tsunamiAt(p,M,false),900);flashBanner('Tsunami warning · offshore Mw '+M.toFixed(1),'warn',4500);}
 else flashBanner('Earthquake · Mw '+M.toFixed(1),'quake',3000);
}
let tsu=null;
function tsunamiAt(p,M,direct){
 U.uTs.value.copy(p);U.uTsT.value=0;U.uTsA.value=Math.max(.35,Math.min(1.1,(M-6.5)/2.5));tsu={t0:simReal};whoosh();
 if(direct){flyTo(p,Math.max(2.8,orbit.tdist));flashBanner('Tsunami launched','warn',2500);
  setPanel('<div class="eyebrow">Tsunami · Mw '+M.toFixed(1)+' source</div><h2>The wave is crossing the ocean</h2>'+
  '<div class="stats"><div class="stat"><b>~713 km/h</b><span>Speed over 4 km-deep water</span></div><div class="stat"><b>~200 km</b><span>Wavelength in deep water</span></div><div class="stat"><b>&lt;1 m</b><span>Height at sea</span></div><div class="stat"><b>10–40 m</b><span>Possible run-up at shore</span></div></div>'+
  '<p>Wave speed depends on depth: √(g × depth). As the seafloor rises near land, the front slows down while the back catches up, so the water piles up. Glowing coastlines show where it hits.</p><p class="note">Clock speed: 1 second here is 20 minutes of real time.</p>');}
}

/* ---------- Banner ---------- */
let bannerTimer=0;
function flashBanner(t,cls,ms){const b=$('#banner');b.textContent=t;b.className=cls||'';b.hidden=false;clearTimeout(bannerTimer);bannerTimer=setTimeout(()=>{b.hidden=true;},ms||2500);}

/* ---------- Plate clock ---------- */
const clock=$('#clock'),clockOut=$('#clockOut'),playBtn=$('#playBtn');let playing=false;
function updClock(){const t=+clock.value;U.uTime.value=t;clockOut.textContent=t===0?'Today':(t>0?'+':'−')+Math.abs(t).toFixed(t%1?1:0)+' Myr';}
clock.addEventListener('input',()=>{playing=false;setPlayIcon();updClock();timeNote();});
function setPlayIcon(){playBtn.innerHTML=playing?'<svg viewBox="0 0 16 16" fill="currentColor"><rect x="3" y="2" width="3.5" height="12"/><rect x="9.5" y="2" width="3.5" height="12"/></svg>':'<svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2l10 6-10 6z"/></svg>';playBtn.setAttribute('aria-label',playing?'Pause plate motion':'Play plate motion');}
playBtn.addEventListener('click',()=>{playing=!playing;if(playing&&+clock.value>=80){clock.value=0;}setPlayIcon();if(playing)timeNote();});
let timeNoted=false;
function timeNote(){if(timeNoted||tool!=='explore')return;timeNoted=true;setPanel('<div class="eyebrow">Plate clock</div><h2>Running today\'s plate speeds forward and back</h2><p>Dark gaps opening between plates are where new ocean floor would form at spreading ridges. Where plates overlap, one would sink into the mantle at a trench.</p><p>Watch Australia head for Southeast Asia and the Atlantic widen as the Americas pull away from Europe and Africa.</p><p class="note">This applies present-day rates with no changes. Real plates speed up, slow down and turn over tens of millions of years, so treat it as a projection, not a map of the past.</p>'+legendHTML());}

/* ---------- Toggles ---------- */
$('#tgPlates').addEventListener('change',e=>{tintTarget=e.target.checked?1:0;});let tintTarget=1;
$('#tgBounds').addEventListener('change',e=>{U.uBounds.value=e.target.checked?1:0;});
$('#tgFlow').addEventListener('change',e=>{flowPts.visible=e.target.checked;});
$('#tgMarks').addEventListener('change',e=>{markGroup.visible=e.target.checked;});
$('#tgSound').addEventListener('change',e=>{soundOn=e.target.checked;ensureAudio();});

/* ---------- Inside Earth mode ---------- */
let cutTarget=5,shownLayer=-1,waveReal=-1;
const labelsEl=$('#labels');
function setMode(m){
 if(m===mode)return;mode=m;$('#tabSurface').setAttribute('aria-pressed',m==='surface');$('#tabInside').setAttribute('aria-pressed',m==='inside');
 $('#surfaceCtrls').style.display=m==='surface'?'flex':'none';$('#insideCtrls').style.display=m==='inside'?'flex':'none';
 $('#tip').hidden=true;U.uHLPlate.value=-1;
 if(m==='inside'){
  const n=camDir();U.uCutN.value.copy(n);const w=new THREE.Vector3(0,1,0).addScaledVector(n,-n.y);if(w.lengthSq()<1e-4)w.set(1,0,0);w.normalize();const u=new THREE.Vector3().crossVectors(w,n);
  DU.uU.value.copy(u);DU.uW.value.copy(w);
  disc.quaternion.setFromUnitVectors(ZAX,n);disc.visible=true;U.uCut.value=1.02;DU.uS.value=1.02;cutTarget=0;
  orbit.tdist=fitDist(2.9);orbit.auto=false;orbit.vth=orbit.vph=0;
  showLayer(2);buildLabels();playing=false;setPlayIcon();
 }else{cutTarget=1.3;labelsEl.innerHTML='';waveReal=-1;DU.uWaveT.value=-1;introPanel();}
}
$('#tabSurface').addEventListener('click',()=>setMode('surface'));$('#tabInside').addEventListener('click',()=>setMode('inside'));$('#backBtn').addEventListener('click',()=>setMode('surface'));
$('#convBtn').addEventListener('click',e=>{const on=DU.uConv.value<.5;DU.uConv.value=on?1:0;e.target.textContent='Convection: '+(on?'on':'off');e.target.setAttribute('aria-pressed',on);});
$('#waveBtn').addEventListener('click',()=>{waveReal=0;DU.uWaveT.value=0;rumble(4,.5);
 setPanel('<div class="eyebrow">Seismic waves</div><h2>How we X-ray the planet</h2><p>A quake at the top sends out P-waves (blue) and S-waves (gold). S-waves cannot travel through liquid, so they stop dead at the outer core. That leaves a huge S-wave shadow beyond 104° from the quake.</p><p>P-waves do pass through the core but bend sharply as they slow down, which leaves a P-wave shadow zone between 104° and 142°.</p><div class="legend"><div><i style="background:var(--tide)"></i>P-wave shadow zone · 104°–142°</div><div><i style="background:var(--ember)"></i>S-wave shadow zone · beyond 104°</div></div><p class="note">Beno Gutenberg used these shadows to place the core boundary at 2,900 km in 1913. The waves here travel in straight lines to keep the picture simple; real ones curve as they speed up with depth.</p>');
 buildLabels(true);});
function showLayer(L){shownLayer=L;const l=LAYERS[L];
 setPanel('<div class="eyebrow">Inside Earth · layer '+(L+1)+' of 5</div><h2>'+l.name+'</h2><div class="stats"><div class="stat"><b>'+l.depth+'</b><span>Depth</span></div><div class="stat"><b>'+l.temp+'</b><span>Temperature</span></div><div class="stat"><b>'+l.state+'</b><span>State</span></div><div class="stat"><b>'+l.dens+'</b><span>Density</span></div></div><p>'+l.fact+'</p><p class="note">Made of: '+l.comp+'.</p>'+
 '<ul class="list">'+LAYERS.map((x,i)=>'<li><button data-layer="'+i+'" '+(i===L?'style="background:#1e242b"':'')+'>'+x.name+'<em>'+x.depth.split(' (')[0]+'</em></button></li>').join('')+'</ul>');
 panelBody.querySelectorAll('[data-layer]').forEach(b=>b.onclick=()=>{showLayer(+b.dataset.layer);DU.uHL.value=+b.dataset.layer;});
}
let LBL=[];
function buildLabels(rim){labelsEl.innerHTML='';LBL=LAYERS.map(l=>{const d=document.createElement('div');d.className='lbl';d.textContent=l.name;labelsEl.appendChild(d);return {el:d,r:l.lblR,a:l.lblA};});
 if(rim){[['P-wave shadow',122-180+360,1.023,'rim'],['S-wave shadow',-150,1.053,'rim s']].forEach(([t,a,r,c])=>{const d=document.createElement('div');d.className='lbl '+c;d.textContent=t;labelsEl.appendChild(d);LBL.push({el:d,r,a,rim:true});});}}
function placeLabels(){if(mode!=='inside')return;const u=DU.uU.value,w=DU.uW.value;
 LBL.forEach(L=>{const a=(180-L.a)*D2R;const p=u.clone().multiplyScalar(Math.cos(a)*L.r).addScaledVector(w,Math.sin(a)*L.r);const s=screenOf(p);
  const vis=DU.uS.value<.05&&(!L.rim||waveReal>8);L.el.style.display=vis?'flex':'none';L.el.style.left=s.x+'px';L.el.style.top=s.y+'px';});}

/* ---------- Sound (starts only after you turn it on) ---------- */
let ac=null,soundOn=false;
function ensureAudio(){if(!soundOn||ac)return;try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
function noiseSrc(dur){const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<d.length;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.5;}const s=ac.createBufferSource();s.buffer=b;return s;}
function rumble(dur,gain){if(!soundOn||!ac)return;const s=noiseSrc(dur),f=ac.createBiquadFilter(),g=ac.createGain();f.type='lowpass';f.frequency.value=90;g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(gain,ac.currentTime+.4);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);s.connect(f).connect(g).connect(ac.destination);s.start();}
function boom(gain){if(!soundOn||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(70,ac.currentTime);o.frequency.exponentialRampToValueAtTime(28,ac.currentTime+1.2);g.gain.setValueAtTime(gain,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+1.6);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+1.7);rumble(3,gain*.6);}
function whoosh(){if(!soundOn||!ac)return;const s=noiseSrc(3),f=ac.createBiquadFilter(),g=ac.createGain();f.type='bandpass';f.frequency.setValueAtTime(300,ac.currentTime);f.frequency.exponentialRampToValueAtTime(900,ac.currentTime+2.5);g.gain.setValueAtTime(0,ac.currentTime);g.gain.linearRampToValueAtTime(.25,ac.currentTime+.8);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+3);s.connect(f).connect(g).connect(ac.destination);s.start();}

/* ---------- Seismograph ---------- */
const scv=$('#seismoCv'),sx=scv.getContext('2d');
const QUAKE_SIM=240; // 1 real second = 4 simulated minutes for seismic waves
function seisSignal(t){
 let v=(Math.sin(t*23.1)*.5+Math.sin(t*41.7+1.3)*.3+Math.sin(t*67.3+.7)*.2)*.035;
 if(VENTS.length){v+=Math.sin(t*12.6)*.07*Math.min(1,VENTS.length);}
 if(quake){const tq=(t-quake.t0)*QUAKE_SIM;const A=Math.min(1,(.18+(quake.M-4)/5.5*.82))/(1+quake.dKm/9000);
  const arr=[[quake.tP,.35,9],[quake.tS,.65,5],[quake.tR,1,2]];
  arr.forEach(([ta,amp,f])=>{const d=(tq-ta)/QUAKE_SIM;if(d>0){v+=A*amp*Math.exp(-d/(f>4?1.4:3.2))*Math.sin(d*f*6.283)*(Math.min(1,d*6));}});}
 return v;
}
function drawSeismo(now){
 const dpr=Math.min(devicePixelRatio||1,2),w=scv.clientWidth,h=scv.clientHeight;if(!w)return;
 if(scv.width!==Math.round(w*dpr)){scv.width=Math.round(w*dpr);scv.height=Math.round(h*dpr);}
 sx.setTransform(dpr,0,0,dpr,0,0);sx.clearRect(0,0,w,h);
 const win=16;sx.strokeStyle='rgba(143,148,155,.18)';sx.lineWidth=1;
 for(let s=0;s<=win;s+=2){const x=w-(((now%2)+s)/win)*w;sx.beginPath();sx.moveTo(x,0);sx.lineTo(x,h);sx.stroke();}
 sx.beginPath();sx.moveTo(0,h/2);sx.lineTo(w,h/2);sx.stroke();
 sx.strokeStyle='#ffb347';sx.lineWidth=1.2;sx.beginPath();
 for(let x=0;x<=w;x+=1){const t=now-win+(x/w)*win;const y=h/2-Math.max(-1,Math.min(1,seisSignal(t)))*h*.46;x?sx.lineTo(x,y):sx.moveTo(x,y);}sx.stroke();
 if(quake){sx.font='500 10px "IBM Plex Mono", monospace';sx.textBaseline='top';
  [['P',quake.tP,'#ffd473'],['S',quake.tS,'#ff8c33'],['Surface',quake.tR,'#ff4d2e']].forEach(([l,ta,c])=>{const tr=quake.t0+ta/QUAKE_SIM;const x=w-(now-tr)/win*w;if(x>=0&&x<=w&&now>=tr){sx.strokeStyle=c;sx.globalAlpha=.8;sx.beginPath();sx.moveTo(x,0);sx.lineTo(x,h);sx.stroke();sx.globalAlpha=1;sx.fillStyle=c;sx.fillText(l,x+3,2);}});
  const el=(now-quake.t0)*QUAKE_SIM;$('#seismoClock').textContent='T+'+fmtClock(el);
  const sp=quake.tS-quake.tP;
  $('#seismoFoot').textContent=el<quake.tP?station.code+' ('+station.name+') · waiting for P-wave…':el<quake.tS?'P arrived · Δ '+quake.deg.toFixed(0)+'° · waiting for S…':'S−P = '+fmtNum(sp)+' s → ≈ '+fmtNum(sp/(1/4.5-1/8))+' km away';
 }
}
function fmtClock(s){s=Math.max(0,Math.round(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return (h?h+'h ':'')+String(m).padStart(2,'0')+'m '+String(ss).padStart(2,'0')+'s';}

/* ---------- Resize & loop ---------- */
function resize(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
 U.uScale.value=h*renderer.getPixelRatio()/(2*Math.tan(camera.fov*D2R/2));}
addEventListener('resize',resize);resize();
function fitDist(base){return Math.max(base,1.12/(Math.tan(camera.fov*D2R/2)*camera.aspect));}
orbit.dist=orbit.tdist=fitDist(3.4);

let last=performance.now(),simReal=0;
function tick(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;simReal+=dt;U.uClockT.value=simReal;
 // camera
 if(orbit.auto&&!reduceMotion)orbit.tth+=dt*.035;
 if(!pointers.size&&!orbit.flying){orbit.tth+=orbit.vth;orbit.tph=Math.min(Math.PI-.12,Math.max(.12,orbit.tph+orbit.vph));orbit.vth*=.92;orbit.vph*=.92;}
 const k=1-Math.pow(orbit.flying?.04:.0005,dt);
 orbit.th+=(orbit.tth-orbit.th)*k;orbit.ph+=(orbit.tph-orbit.ph)*k;orbit.dist+=(orbit.tdist-orbit.dist)*(1-Math.pow(.02,dt));
 if(orbit.flying&&Math.abs(orbit.tth-orbit.th)<.002&&Math.abs(orbit.tph-orbit.ph)<.002)orbit.flying=false;
 camera.position.set(Math.sin(orbit.ph)*Math.sin(orbit.th),Math.cos(orbit.ph),Math.sin(orbit.ph)*Math.cos(orbit.th)).multiplyScalar(orbit.dist);
 camera.lookAt(0,0,0);
 if(shake>.0002){const s=reduceMotion?shake*.2:shake;camera.position.x+=(Math.random()-.5)*s;camera.position.y+=(Math.random()-.5)*s;camera.position.z+=(Math.random()-.5)*s;shake*=Math.pow(.25,dt);}
 // light follows camera so the visible face is lit
 U.uLight.value.set(-.45,.55,.7).normalize();
 // plate clock
 if(playing){let t=+clock.value+dt*8;if(t>=80){t=80;playing=false;setPlayIcon();}clock.value=t;updClock();}
 U.uTint.value+=(tintTarget-U.uTint.value)*Math.min(1,dt*4);
 // waves
 if(quake){U.uQT.value=(simReal-quake.t0)*QUAKE_SIM;if(U.uQT.value>22000){U.uQT.value=-1;}}
 if(tsu){U.uTsT.value=(simReal-tsu.t0)*1200;if(U.uTsT.value>110000){U.uTsT.value=-1;tsu=null;}}
 // cutaway
 if(mode==='inside'||U.uCut.value<2){const c=U.uCut.value+(cutTarget-U.uCut.value)*Math.min(1,dt*(mode==='inside'?2.2:3.5));U.uCut.value=c;DU.uS.value=Math.max(0,c);
  disc.position.copy(U.uCutN.value).multiplyScalar(Math.max(0,c));
  clipPlane.normal.copy(U.uCutN.value).negate();clipPlane.constant=Math.max(0,c);
  if(mode==='surface'&&c>1.0){U.uCut.value=5;clipPlane.constant=5;disc.visible=false;}}
 DU.uT.value=simReal;
 if(waveReal>=0){waveReal+=dt;DU.uWaveT.value=waveReal*200;if(waveReal>40){waveReal=-1;DU.uWaveT.value=-1;}}
 if(flowPts.visible)updateFlow(dt);
 placeMarkers();updateEruptions(dt);placeLabels();
 renderer.render(scene,camera);
 drawSeismo(simReal);
 requestAnimationFrame(tick);
}
$('#loading').remove();
setTool('explore');
requestAnimationFrame(tick);

$('#panelToggle').addEventListener('click',()=>{const p=$('#panel');const c=p.classList.toggle('collapsed');$('#panelToggle').textContent=c?'Show':'Hide';$('#panelToggle').setAttribute('aria-expanded',!c);});
window.__RE={setTool,quakeAt,eruptAt,tsunamiAt,setMode,VOLCANOES,QUAKES,PLATES,velocity,bearing,plateOf,ll2v,U,BOUND};
})();
